# window rules
window_rule=tags:3,app_id:^firefox$
window_rule=tags:3,app_id:^zen$
window_rule=is_floating:1,width:400,height:400,app_id:^otter-launcher$
window_rule=is_floating:1,width:600,height:400,app_id:^floating-term$
window_rule=is_floating:1,width:1000,height:600,title:^big-size$

# layer animation style for launcher
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:otter-launcher
