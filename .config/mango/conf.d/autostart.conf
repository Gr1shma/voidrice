# autostart
exec_once=/home/grishma/.local/bin/start-protocol
exec_once = killall pipewire; pipewire
exec_once=swayidle -w timeout 300 'mmsg dispatch disable_monitor,eDP-1; mmsg dispatch disable_monitor,HDMI-A-1' resume 'mmsg dispatch enable_monitor,eDP-1; mmsg dispatch enable_monitor,HDMI-A-1'
exec_once=awww-daemon --quiet &
exec_once=mangobar
exec_once=foot --server
exec_once=sleep 1 && mangostyle
exec_once=cclipd -s 2 -t "image/png" -t "image/*" -t "text/plain;charset=utf-8" -t "text/*" -t "*"
exec_once = ~/.local/bin/brightness-restore

exec=gsettings set org.gnome.desktop.interface gtk-theme "Breeze-Dark"
exec=gsettings set org.gnome.desktop.interface icon-theme "breeze-dark"
exec=gsettings set org.gnome.desktop.interface cursor-theme "Adwaita"
exec=gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
