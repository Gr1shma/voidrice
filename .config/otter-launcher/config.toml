[general]
height = 15
empty_module = "a"
default_module = "g"
alternative_module = ""
control_module = ""
exec_cmd = "zsh -c"
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
external_editor = ""

[interface]
padding = [1, 2, 1, 3] # [top, right, down, left]
header = "\u001B[34;1m>\u001B[0m \u001B[1m$USER\u001B[0m\u001B[90m@$(echo $HOST)\u001B[0m"
header_color = "reset"
prompt_sign = "❯ "
prompt_sign_color = "blue"
placeholder = "search the internet"
suggestion_mode = "list"
suggestion_position = "bottom"
prefix_color = "yellow"
prefix_padding = 3
description_color = "reset"
selection_prefix = "▌ "
selection_prefix_color = "red"
inverse_selection = true
list_prefix = "  "
list_prefix_color = "reset"
indicator_args = "^ "
indicator_bare = "$ "
indicator_color = "red"
scrollbar = true
separator = true
separator_label = "  otter "

[image]
format = "symbol"
path = ""
width = 12
position = "left"
padding = [0, 0, 0, 0]

[[modules]]
description = "launch apps with fsel"
prefix = "app"
cmd = "fsel -vv -r -d -ss \"{}\""
with_argument = true

[[modules]]
description = "launch apps instantly"
prefix = "a"
cmd = "fsel -vv -r -d -p {}"
with_argument = true

[[modules]]
description = "manage clipboard with fsel"
prefix = "cl"
cmd = "fsel --cclip"
with_argument = false

[[modules]]
description = "search with google"
prefix = "g"
cmd = "xdg-open 'https://google.com/search?q={}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search youtube"
prefix = "yt"
cmd = "xdg-open 'https://www.youtube.com/search?q={}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search youtube music"
prefix = "ym"
cmd = "xdg-open 'https://music.youtube.com/search?q={}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "kill a running app"
prefix = "k"
cmd = 'ps -u "$USER" -o comm= | sort -u | fsel --dmenu | xargs -r pkill -9'
with_argument = false

[[modules]]
description = "install pkgs"
prefix = "i"
cmd = "doas xbps-install -Sy {}"
with_argument = true

[[modules]]
description = "search notes"
prefix = "n"
cmd = "search_notes"
with_argument = false

[[modules]]
description = "bookmarks"
prefix = "bm"
cmd = "bookmark"
with_argument = false

[[modules]]
description = "queue playlist"
prefix = "ml"
cmd = "mpc-playlists"
with_argument = false

[[modules]]
description = "search and play song"
prefix = "ms"
cmd = "mpc-search"
with_argument = false

[[modules]]
description = "play/pause"
prefix = "pp"
cmd = "mpc toggle"
with_argument = false

[[modules]]
description = "next track"
prefix = "mn"
cmd = "mpc next"
with_argument = false

[[modules]]
description = "prev track"
prefix = "mp"
cmd = "mpc prev"
with_argument = false
